<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download File Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- design tokens: defined once ---------- */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --raise:#eceef1; --line:rgba(20,24,30,.1);
  --text:#1b1d21; --muted:#646b75; --accent:#44546a; --on-accent:#ffffff; --accent-soft:rgba(68,84,106,.12);
  --danger:#d93025;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:6px; --r:10px; --h:34px;
  --font:'Geist','Segoe UI','Nirmala UI','Segoe UI Historic','Microsoft YaHei UI','Yu Gothic UI','Malgun Gothic','Segoe UI Emoji','Segoe UI Symbol',sans-serif;
  --t-body:14px; --t-small:12px; --t-title:16px;
  --ease:160ms ease-out;
  --cols:36px minmax(0,1fr) 92px 170px 100px 108px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1c20; --surface:#22252a; --raise:#2b2f35; --line:rgba(255,255,255,.08);
    --text:#e6e8eb; --muted:#9097a1; --accent:#8fa6c4; --on-accent:#0f1a2a; --accent-soft:rgba(143,166,196,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1c20; --surface:#22252a; --raise:#2b2f35; --line:rgba(255,255,255,.08);
  --text:#e6e8eb; --muted:#9097a1; --accent:#8fa6c4; --on-accent:#0f1a2a; --accent-soft:rgba(143,166,196,.16);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--t-body)/1.45 var(--font);-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--t-small);color:var(--muted)}

/* ---------- shared controls ---------- */
.win{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.btn{height:var(--h);padding:0 var(--s3);border-radius:var(--r-sm);border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;gap:var(--s2);transition:background var(--ease)}
.btn:hover{background:var(--raise)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:500}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.outline{border-color:var(--line)}
.btn.icon{width:var(--h);padding:0;justify-content:center}
.field{height:var(--h);width:100%;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);outline:none;transition:border-color var(--ease)}
.field:focus{border-color:var(--accent)}
.badge{font-size:11px;line-height:1;padding:4px 8px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}


/* ---------- title bar ---------- */
.title{flex:0 0 36px;display:flex;align-items:center;height:36px;background:var(--raise);border-bottom:1px solid var(--line);padding-left:var(--s3);gap:var(--s2);user-select:none}
.title img{width:18px;height:18px;display:block}
.title b{font-weight:500;font-size:var(--t-small);flex:1}
.wc{display:flex;height:100%}
.wc button{width:46px;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);transition:background var(--ease),color var(--ease)}
.wc button:hover{background:var(--line);color:var(--text)}
.wc button.x:hover{background:var(--danger);color:#fff}
.wc svg.i{width:14px;height:14px}

/* ---------- Download File Info panel ---------- */
.dw{width:560px;height:380px;max-width:100%;min-width:560px;min-height:380px;max-height:380px;display:flex;flex-direction:column;box-sizing:border-box}
.dlb{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:20px 24px 16px;box-sizing:border-box}
.fs{display:flex;align-items:center;gap:var(--s3);height:48px;padding-bottom:0;border-bottom:1px solid var(--line);box-sizing:border-box;margin-bottom:16px}
.fi{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent)}
.fs .tx{min-width:0}
.fs b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs b.bad{color:var(--danger)}
.fs .meta{display:block}
.lb{display:block;font-size:var(--t-small);line-height:16px;color:var(--muted);margin:0 0 4px}
.sv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:start;height:54px;margin-bottom:12px}
.sv>div{min-width:0}
.pr{display:flex;gap:var(--s2);align-items:center}
.pr .field,#dlLink{min-width:0;text-overflow:ellipsis}
select.field{
  height:var(--h);
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background-color:var(--bg);
  padding:0 var(--s3);
  font:inherit;
  font-size:var(--t-body);
  color:var(--text);
  width:100%;
  cursor:pointer;
  box-sizing:border-box;
  margin:0;
}
select.field:focus{border-color:var(--accent);outline:none}
input.field{
  height:var(--h);
  box-sizing:border-box;
  margin:0;
}
.btn.icon{
  height:var(--h);
  width:34px;
  box-sizing:border-box;
  margin:0;
  flex:none;
}
.rm{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-small);color:var(--muted);height:20px}
.rm input{accent-color:var(--accent);margin:0}
.dlf{flex:0 0 59px;height:59px;box-sizing:border-box;display:flex;justify-content:flex-end;align-items:center;gap:var(--s2);padding:12px 24px;border-top:1px solid var(--line)}

/* ---------- standalone layout ---------- */
body{display:grid;place-items:center;min-height:100vh;padding:var(--s4)}
</style>
</head>

var ICON={Video:"video",Music:"music",Documents:"doc",Compressed:"zip",Programs:"app",Other:"other"};
var DIRS={Video:"Videos",Music:"Music",Documents:"Documents",Compressed:"Compressed",Programs:"Programs",Other:"Downloads"},EXT={Video:"mp4",Music:"mp3",Documents:"pdf",Compressed:"zip",Programs:"exe",Other:"bin"},mem={},pick=null,ALT=["C:\\Users\\steam\\Videos\\","C:\\Users\\steam\\Downloads\\","C:\\Users\\steam\\Desktop\\","D:\\Media\\"];
var SUB={"<":"＜",">":"＞",":":"：",'"':"＂","/":"⧸","\\":"⧹","|":"｜","?":"？","*":"＊"};
function sGood(t,vid,room){
  var n=t.normalize("NFC").replace(/[\u0000-\u001F\u007F]/g,"").replace(/[<>:"\/\\|?*]/g,function(c){return SUB[c]}).replace(/\s+/g," ").trim();
  n=Array.from(n).slice(0,Math.max(20,room)).join("").replace(/[. ]+$/g,"");
  if(!/[\p{L}\p{N}]/u.test(n))n=vid;
  if(/^(CON|PRN|AUX|NUL|COM[0-9\u00B9\u00B2\u00B3]|LPT[0-9\u00B9\u00B2\u00B3])(\..*)?$/i.test(n))n="_"+n;
  return n;
}
function vidId(u){try{return new URL(u).searchParams.get("v")||"video"}catch(e){return"video"}}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return"link"}}
function baseDir(c){return pick||mem[c]||"C:\\Users\\steam\\"+DIRS[c]+"\\"}
function alignPathEnd(){
  var el=$("dlPath");
  if(el && document.activeElement!==el){
    el.scrollLeft=el.scrollWidth;
  }
}
function normLink(link){
  try {
    var u = new URL(link.trim());
    if (u.searchParams.has("v")) {
      u.searchParams.delete("list");
      u.searchParams.delete("start_radio");
      u.searchParams.delete("index");
      return u.toString();
    }
  } catch(e) {}
  return link.trim();
}
function dRefresh(){
  if(!$("dlCat"))return;
  var c=$("dlCat").value,t=$("dlTitle").value,rawLink=$("dlLink").value,dir=baseDir(c),ext=EXT[c];
  var link=normLink(rawLink);
  if(link!==rawLink)$("dlLink").value=link;
  var path=dir+sGood(t,vidId(link),250-dir.length-ext.length-1)+"."+ext;
  $("dlPath").value=path;
  $("dlPath").title=path;
  $("dlName").textContent=path.split("\\").pop();
  $("dlMeta").textContent=c+" · "+hostOf(link);
  $("dlIco").setAttribute("href","#"+(ICON[c]||"other"));
  $("dlRemT").textContent="Use this folder for "+c.toLowerCase()+" next time";
  if($("dlGo"))$("dlGo").disabled=!link.trim();
  setTimeout(alignPathEnd, 0);
}
function start(){
  var rawLink=$("dlLink").value;
  var link=normLink(rawLink);
  if(!link)return;
  var c=$("dlCat").value,path=$("dlPath").value,dir=path.slice(0,path.lastIndexOf("\\")+1);
  var remember=$("dlRem").checked;
  if(remember)mem[c]=dir;else delete mem[c];
  var info={link:link,category:c,path:path,fileName:path.split("\\").pop(),folder:dir,remember:remember};
  pick=null;dRefresh();
  if(typeof window.onStartDownload==="function")window.onStartDownload(info);else console.log("Start download",info);
}
function cancel(){pick=null;dRefresh();if(typeof window.onCancelDownload==="function")window.onCancelDownload()}
if($("dlLink"))$("dlLink").addEventListener("input",dRefresh);
if($("dlCat"))$("dlCat").addEventListener("change",function(){pick=null;dRefresh()});
if($("dlBrowse"))$("dlBrowse").onclick=function(){var i=ALT.indexOf(baseDir($("dlCat").value));pick=ALT[(i+1)%ALT.length];dRefresh()};
if($("dlPath"))$("dlPath").addEventListener("blur",alignPathEnd);
if($("dlGo"))$("dlGo").onclick=start;
if($("dlCancel"))$("dlCancel").onclick=cancel;
if($("dlX"))$("dlX").onclick=cancel;
/* Call CosmoNewDownload.set({link:"...", title:"Video title"}) to fill the dialog from your app. */
window.CosmoNewDownload={set:function(o){if(o.link!=null)$("dlLink").value=o.link;if(o.title!=null)$("dlTitle").value=o.title;pick=null;dRefresh()}};
dRefresh();
})();
</script>
