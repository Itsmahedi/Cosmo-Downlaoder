<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmo Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header: logo + name + version + connection dot -->
  <div class="ph"><img src="icons/icon-48.png" alt=""><div><b>Cosmo Downloader</b><span class="meta">v1.13.0</span></div><i class="dot" id="statusDot"></i></div>

  <!-- Connected/disconnected banner -->
  <div class="conn" id="statusBar">
    <svg class="i" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <span id="statusText">Connected to Cosmo Downloader</span>
  </div>

  <!-- Intercept toggle -->
  <div class="toggle">
    <div><b>Intercept Downloads</b><span class="meta">Instant capture in browser</span></div>
    <label class="sw"><input type="checkbox" id="toggleIntercept" checked aria-label="Intercept Downloads"><i></i></label>
  </div>

  <!-- Intercepted count -->
  <div class="count"><b class="num" id="interceptedCount">0</b><span class="meta">Intercepted files</span></div>

  <!-- URL send -->
  <div class="send">
    <input class="field" id="urlInput" placeholder="Paste URL to download…" aria-label="URL to download" spellcheck="false">
    <button class="btn primary icon" id="addUrlBtn" type="button" aria-label="Download">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    </button>
  </div>
  <div class="url-feedback" id="urlFeedback"></div>

  <!-- Footer -->
  <div class="pfoot">&copy; 2026 Mahedi</div>

  <script src="popup.js"></script>
</body>
</html>
