<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="ph">
      <img class="logo" src="icons/icon-32.png" alt="Cosmo Downloader logo">
      <span>Cosmo</span>
      <i class="dot" id="statusDot" title="Checking status..."></i>
      <span id="statusText">Checking...</span>
    </div>

    <!-- Toggle & Stats -->
    <div class="toggle">
      <div>
        <div class="toggle-title">Catch downloads automatically</div>
        <div class="meta num"><span id="interceptedCount">0</span> caught this session</div>
      </div>
      <label class="sw">
        <input type="checkbox" id="toggleIntercept" checked aria-label="Catch downloads automatically">
        <i></i>
      </label>
    </div>

    <!-- Quick URL send -->
    <div class="send">
      <input class="field" id="urlInput" placeholder="https://..." aria-label="Link to download" spellcheck="false">
      <button class="btn icon outline" id="addUrlBtn" type="button" aria-label="Download" title="Send to Cosmo Downloader">
        <svg class="i" viewBox="0 0 24 24">
          <path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>
        </svg>
      </button>
    </div>

    <div id="urlFeedback" class="url-feedback" style="display: none;"></div>
    <div id="statusError" class="status-error" style="display: none;"></div>

    <!-- App Launcher if closed -->
    <button id="launchBtn" class="btn outline" type="button" style="display: none; width: 100%; justify-content: center; font-size: var(--t-small); height: 28px;">
      <span class="launch-spinner" id="launchSpinner"></span>
      <span id="launchBtnText">Launch Cosmo</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
