<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmo Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="win popup">
    <!-- Header -->
    <div class="ph">
      <img class="logo" src="icons/icon-48.png" alt="Cosmo Downloader logo">
      <div>
        <b>Cosmo Downloader</b>
        <span class="meta" id="versionText">v1.10.1</span>
      </div>
      <i class="dot" id="statusDot" title="Checking status..."></i>
    </div>

    <!-- Connection Banner -->
    <div class="conn" id="connBanner">
      <svg class="i" id="connIcon" style="width:14px;height:14px" viewBox="0 0 24 24">
        <path d="M5 12.5l4.5 4.5L19 7.5"/>
      </svg>
      <span id="connText">Checking connection...</span>
    </div>

    <!-- Intercept Toggle -->
    <div class="toggle">
      <div>
        <b>Intercept downloads</b>
        <span class="meta">Instant capture in browser</span>
      </div>
      <label class="sw">
        <input type="checkbox" id="toggleIntercept" checked aria-label="Intercept downloads">
        <i></i>
      </label>
    </div>

    <!-- Intercepted Files Hero Counter -->
    <div class="count">
      <b class="num" id="interceptedCount">0</b>
      <span class="meta">Intercepted files</span>
    </div>

    <!-- Send Link -->
    <div class="send">
      <input class="field" id="urlInput" placeholder="Paste URL to download…" aria-label="URL to download" spellcheck="false">
      <button class="btn primary icon" id="addUrlBtn" type="button" aria-label="Download" title="Send to Cosmo Downloader">
        <svg class="i" viewBox="0 0 24 24">
          <path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>
        </svg>
      </button>
    </div>

    <!-- Feedback / Errors -->
    <div id="urlFeedback" class="url-feedback" style="display: none;"></div>
    <div id="statusError" class="status-error" style="display: none;"></div>

    <!-- App Launcher if closed -->
    <div id="launchContainer" style="padding: 0 var(--s4) var(--s3); display: none;">
      <button id="launchBtn" class="btn outline" type="button" style="width: 100%; justify-content: center; font-size: var(--t-small); height: 32px;">
        <span class="launch-spinner" id="launchSpinner"></span>
        <span id="launchBtnText">Launch Cosmo</span>
      </button>
    </div>

    <!-- Filters & Site Exclusions -->
    <details class="filters-box" id="filtersBox">
      <summary>Filters &amp; site exclusions</summary>
      <div class="filters-body">
        <label class="filter-label" for="extFilterInput">File types (comma-separated)</label>
        <input class="field small-field" id="extFilterInput" placeholder="zip, rar, 7z, exe, mp4, pdf" spellcheck="false">
        <label class="filter-label" for="minSizeInput">Minimum size (KB, 0 = all matching)</label>
        <input class="field small-field" id="minSizeInput" type="number" min="0" step="1" placeholder="10">
        <label class="filter-label" for="excludedSitesInput">Excluded domains</label>
        <input class="field small-field" id="excludedSitesInput" placeholder="example.com, intranet.local" spellcheck="false">
        <div class="filter-actions">
          <button class="btn outline small-btn" id="saveFiltersBtn" type="button">Save filters</button>
          <span class="filter-saved" id="filterSavedMsg"></span>
        </div>
      </div>
    </details>

    <!-- Footer -->
    <div class="pfoot">© 2026 Mahedi</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
